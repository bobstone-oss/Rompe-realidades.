[package]
name = "nexus_xr_kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
# Binding oficial de ONNX Runtime para Rust con aceleración SIMD/TensorRT/CoreML/DirectML
ort = { version = "2.0.0-rc.15", features = ["load-dynamic", "ndarray"] }
ndarray = "0.17"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
